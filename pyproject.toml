[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebuild"
version = "0.1.0"
description = "Koji extension for automatic dependency resolution and building"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "VibeBuild Team"}
]
keywords = ["koji", "rpm", "srpm", "build", "fedora", "dependency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=24,<26",
    "isort>=5.12",
    "mypy>=1.0",
    "flake8>=6.0",
]

[project.scripts]
vibebuild = "vibebuild.cli:main"

[tool.setuptools.packages.find]
include = ["vibebuild*"]
exclude = ["tests*", "dev*", "ansible*", "scripts*", "docs*"]

[tool.setuptools.package-data]
vibebuild = ["data/*.json", "data/*.joblib"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["vibebuild"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Typing в проекте намеренно нестрогий: koji/rpm/joblib возвращают untyped
# объекты, Path/str interop осознанно используется в analyzer/builder.
# Жёсткий typing — задача отдельного релиза.

[[tool.mypy.overrides]]
module = [
    "vibebuild.analyzer",
    "vibebuild.builder",
    "vibebuild.fetcher",
    "vibebuild.ml_resolver",
    "vibebuild.name_resolver",
    "vibebuild.resolver",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=vibebuild --cov-report=term-missing"

[tool.coverage.run]
source = ["vibebuild"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
# B404 / B603: subprocess вызовы намеренные и используют список-форму,
#   shell=True запрещён архитектурно (см. SECURITY.md, фикс 945b721).
# B607: koji/rpm — фиксированные системные команды, путь к ним валидирован
#   PATH, абсолютные пути сделали бы пакет непереносимым между дистрибутивами.
# B101: assert используется только для нарушения внутренних инвариантов,
#   не для валидации недоверенного ввода.
# B110 / B112: try/except/pass — best-effort cleanup путей и кеша, исключения
#   логируются вышестоящим вызовом.
# B311: random.shuffle в scripts/train_model.py — для перемешивания train/test
#   сплита, не для крипто-целей.
skips = ["B101", "B110", "B112", "B311", "B404", "B603", "B607"]
exclude_dirs = ["tests", "scripts", "dev"]
