name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (black + isort + flake8 + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: black --check
        run: black --check .
      - name: isort --check
        run: isort --check .
      - name: flake8
        run: flake8
      - name: mypy
        run: mypy vibebuild

  unit:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system deps (rpm, cpio)
        run: sudo apt-get update && sudo apt-get install -y rpm cpio
      - name: Install vibebuild
        run: pip install -e ".[dev,ml]"
      - name: Run pytest with coverage
        run: pytest -q --cov-report=term
      - name: Coverage summary
        if: matrix.python == '3.12'
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: docker-compose smoke
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - name: Start koji-server
        working-directory: dev/koji-server
        run: |
          cp .env.default .env
          bash scripts/generate-certs.sh
          docker compose up -d --build db koji-hub
          timeout 180 bash -c 'until docker compose exec -T koji-hub curl -sk https://localhost/kojihub >/dev/null 2>&1; do sleep 2; done'
          bash scripts/koji-init.sh
          docker compose up -d --build koji-builder vibebuild-dev
      - name: Wait for vibebuild install in container
        working-directory: dev/koji-server
        run: |
          timeout 180 bash -c '
            until docker compose exec -T vibebuild-dev command -v vibebuild >/dev/null 2>&1; do
              sleep 3
            done
          '
      - name: Smoke vibebuild --analyze-only inside container
        working-directory: dev/koji-server
        run: |
          docker compose exec -T vibebuild-dev bash -c '
            mkdir -p /tmp/vb && cd /tmp/vb
            curl -sL -o hello.src.rpm \
              https://kojipkgs.fedoraproject.org/packages/hello/2.12.2/1.fc42/src/hello-2.12.2-1.fc42.src.rpm
            vibebuild --analyze-only hello.src.rpm
          '
      - name: Dump container logs on failure
        if: failure()
        working-directory: dev/koji-server
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        working-directory: dev/koji-server
        run: docker compose down -v
